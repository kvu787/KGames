[package]
name = "simple_paint_tests"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# Each test is its own program, and prints what it measured.
[[test]]
name = "contract"
harness = false

[[test]]
name = "orthographic_transforms"
harness = false

[[test]]
name = "gpu"
harness = false

[[test]]
name = "shader_compilation"
harness = false

[dependencies]
graphics = { path = "../../Library/Graphics" }
math = { path = "../../Library/Math" }
shader_compiler = { path = "../../Library/ShaderCompiler" }
simple_paint = { path = "../../Library/SimplePaint" }
windows_api = { path = "../../Library/WindowsApi" }

[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]

[build-dependencies]
shader_compiler = { path = "../../Library/ShaderCompiler" }

[lints]
workspace = true
