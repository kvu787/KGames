[package]
name = "game-input-tests"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# Cargo makes a test binary of each file in tests, so runtime_imports.rs is one
# of its own, and nothing loads the runtime before its test puts a file beside
# the exe.

[dependencies]
game-input = { path = "../../Library/GameInput" }
game-input-raw = { path = "../../Library/GameInputRaw" }
windows-api-raw = { path = "../../Library/WindowsApiRaw" }

[dependencies.windows-core]
workspace = true

[lints]
workspace = true
