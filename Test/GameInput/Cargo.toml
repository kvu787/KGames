[package]
name = "game_input_tests"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# Cargo makes a test binary of each file in tests, so runtime_imports.rs is one
# of its own, and nothing loads the runtime before its test puts a file beside
# the exe.

[dependencies]
game_input = { path = "../../Library/GameInput" }
game_input_raw = { path = "../../Library/GameInputRaw" }
windows_api_raw = { path = "../../Library/WindowsApiRaw" }

[dependencies.windows-core]
workspace = true

[lints]
workspace = true
