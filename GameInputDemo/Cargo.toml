[package]
name = "game_input_demo"
version = "0.1.0"
edition = "2024"
build = "Build.rs"
default-run = "GameInputDemo"

[[bin]]
name = "GameInputDemo"
path = "Source/Main.rs"

# Shows each display's identifier on it, for choosing the display the demo opens on.
[[bin]]
name = "IdentifyDisplays"
path = "Source/IdentifyDisplays.rs"

# Source/Bindings.rs is generated by BindingsGenerator, and Source/GameInput.rs
# is written by hand from GameInput.h. Both need only windows-core.
# Its proc macros (for implementing COM interfaces in Rust) aren't needed.
[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]
