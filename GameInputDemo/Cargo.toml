[package]
name = "game_input_demo"
version = "0.1.0"
edition = "2024"
build = "Build.rs"

[[bin]]
name = "GameInputDemo"
path = "Source/Main.rs"

# Source/Bindings.rs is generated by BindingsGenerator, and Source/GameInput.rs
# is written by hand from GameInput.h. Both need only windows-core.
# Its proc macros (for implementing COM interfaces in Rust) aren't needed.
[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]
