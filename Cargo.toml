# One Cargo workspace for every Rust package in the repo. They share this
# folder's Cargo.lock and target folder, so the Library crates build once for
# all of the programs and tests that use them.
[workspace]
resolver = "3"
members = [
    "Library/Displays",
    "Library/GameInput",
    "Library/GameInputRaw",
    "Library/Gltf",
    "Library/Graphics",
    "Library/Json",
    "Library/Math",
    "Library/Meshes",
    "Library/PaintSettings",
    "Library/PolygonMesh",
    "Library/PresentTiming",
    "Library/ShaderCompiler",
    "Library/SimplePaint",
    "Library/UserInterface",
    "Library/WindowsApi",
    "Library/WindowsApiRaw",
    "Library/WindowsApiRaw/BindingsGenerator",
    "Program/Benchmarks",
    "Program/FrameTimes",
    "Program/GameInputDemo",
    "Program/IdentifyDisplays",
    "Program/MeshModeler",
    "Program/MinimalSceneTest",
    "Program/Platformer",
    "Program/SimplePaintDemo",
    "Program/SpinningCarTest",
    "Program/UiShowcase",
    "Program/Veehiicuul",
    "Test/Benchmarks",
    "Test/FrameTimes",
    "Test/GameInput",
    "Test/GameInputDemo",
    "Test/Gltf",
    "Test/Graphics",
    "Test/IdentifyDisplays",
    "Test/Json",
    "Test/Math",
    "Test/MeshModeler",
    "Test/Meshes",
    "Test/PaintSettings",
    "Test/MinimalSceneTest",
    "Test/Platformer",
    "Test/PolygonMesh",
    "Test/PresentTiming",
    "Test/SimplePaint",
    "Test/SimplePaintDemo",
    "Test/SpinningCarTest",
    "Test/UiShowcase",
    "Test/UserInterface",
    "Test/Veehiicuul",
    "Test/WindowsApi",
]

# The license of every package, which each takes with license.workspace = true.
[workspace.package]
license = "GPL-3.0-or-later"

# Dependencies that each package takes with workspace = true, so that their
# versions change in one place.
[workspace.dependencies]
# Microsoft's crate under the Windows API bindings, without its proc macros
# (for implementing COM interfaces in Rust), which nothing here needs.
windows-core = { version = "0.100", default-features = false, features = ["std"] }
# Writes Library/WindowsApiRaw/src/bindings.rs for this version of windows-core,
# so upgrade the two together, and regenerate the bindings.
windows-bindgen = "0.100"

# Lints for every package, which each takes with [lints] workspace = true.
[workspace.lints.clippy]
# Most unsafe functions here are unsafe because they call the Windows API,
# not for what their callers must do, and the code's comments are //
# comments, which clippy doesn't read as docs.
missing_safety_doc = "allow"
