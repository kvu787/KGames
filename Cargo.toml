# One Cargo workspace for every Rust package in the repo. They share this
# folder's Cargo.lock and target folder, so the Library crates build once for
# all of the programs and tests that use them.
#
# The bindings generators aren't members. Each is a workspace of its own, so
# that normal builds never compile windows-bindgen.
[workspace]
resolver = "3"
members = [
    "Library/Application",
    "Library/Canvas",
    "Library/Displays",
    "Library/GameInput",
    "Library/Graphics",
    "Library/Json",
    "Library/Math",
    "Library/Meshes",
    "Library/PaintSettings",
    "Library/ShaderCompiler",
    "Library/SimplePaint",
    "Library/WindowsApi",
    "Program/GameInputDemo",
    "Program/HelloDirect3D12",
    "Program/IdentifyDisplays",
    "Program/MinimalSceneTest",
    "Program/SimplePaintDemo",
    "Test/Math",
    "Test/SimplePaint",
]
