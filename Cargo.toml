# One Cargo workspace for every Rust package in the repo. They share this
# folder's Cargo.lock and target folder, so the Library crates build once for
# all of the programs and tests that use them.
#
# The bindings generator in Library/WindowsApi isn't a member. It's a workspace
# of its own, so that normal builds never compile windows-bindgen.
[workspace]
resolver = "3"
members = [
    "Library/Displays",
    "Library/GameInput",
    "Library/Gltf",
    "Library/Graphics",
    "Library/Json",
    "Library/Math",
    "Library/Meshes",
    "Library/PaintSettings",
    "Library/PolygonMesh",
    "Library/ShaderCompiler",
    "Library/SimplePaint",
    "Library/UserInterfaceOld",
    "Library/WindowsApi",
    "Program/GameInputDemo",
    "Program/IdentifyDisplays",
    "Program/MinimalSceneTest",
    "Program/SimplePaintDemo",
    "Program/SpinningCarTest",
    "Program/UiShowcase",
    "Program/Veehiicuul",
    "Test/GameInputDemo",
    "Test/Gltf",
    "Test/IdentifyDisplays",
    "Test/Json",
    "Test/Math",
    "Test/Meshes",
    "Test/MinimalSceneTest",
    "Test/PolygonMesh",
    "Test/SimplePaint",
    "Test/SimplePaintDemo",
    "Test/SpinningCarTest",
    "Test/UiShowcase",
    "Test/UserInterface",
    "Test/Veehiicuul",
]

# Lints for every package, which each takes with [lints] workspace = true.
[workspace.lints.clippy]
# Most unsafe functions here are unsafe because they call the Windows API,
# not for what their callers must do, and the code's comments are //
# comments, which clippy doesn't read as docs.
missing_safety_doc = "allow"
