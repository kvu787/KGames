# One Cargo workspace for every Rust package in the repo. They share this
# folder's Cargo.lock and target folder, so the Library crates build once for
# all of the programs and tests that use them.
[workspace]
resolver = "3"
members = [
    "Library/aseprite",
    "Library/displays",
    "Library/game-input",
    "Library/game-input-raw",
    "Library/game-input-raw/bindings-generator",
    "Library/gltf",
    "Library/graphics",
    "Library/json",
    "Library/math",
    "Library/meshes",
    "Library/paint-settings",
    "Library/polygon-mesh",
    "Library/present-timing",
    "Library/shader-compiler",
    "Library/simple-paint",
    "Library/user-interface",
    "Library/windows-api",
    "Library/windows-api-raw",
    "Library/windows-api-raw/bindings-generator",
    "Program/benchmarks",
    "Program/frame-times",
    "Program/game-input-demo",
    "Program/identify-displays",
    "Program/mesh-modeler",
    "Program/minimal-scene-test",
    "Program/platformer",
    "Program/simple-paint-demo",
    "Program/spinning-car-test",
    "Program/ui-showcase",
    "Program/veehiicuul",
    "Test/aseprite",
    "Test/benchmarks",
    "Test/frame-times",
    "Test/game-input",
    "Test/game-input-demo",
    "Test/gltf",
    "Test/graphics",
    "Test/identify-displays",
    "Test/json",
    "Test/math",
    "Test/mesh-modeler",
    "Test/meshes",
    "Test/minimal-scene-test",
    "Test/paint-settings",
    "Test/platformer",
    "Test/polygon-mesh",
    "Test/present-timing",
    "Test/run-lightly",
    "Test/simple-paint",
    "Test/simple-paint-demo",
    "Test/spinning-car-test",
    "Test/ui-showcase",
    "Test/user-interface",
    "Test/veehiicuul",
    "Test/windows-api",
]

# The license of every package, which each takes with license.workspace = true.
[workspace.package]
license = "GPL-3.0-or-later"

# Dependencies that each package takes with workspace = true, so that their
# versions change in one place.
[workspace.dependencies]
# Microsoft's crate under the Windows API bindings, without its proc macros
# (for implementing COM interfaces in Rust), which nothing here needs.
windows-core = { version = "0.100", default-features = false, features = ["std"] }
# Writes Library/windows-api-raw/src/bindings.rs and
# Library/game-input-raw/src/lib.rs for this version of windows-core, so
# upgrade the three together, and regenerate the bindings.
windows-bindgen = "0.100"
# Writes the metadata that Library/game-input-raw's bindings-generator gives
# windows-bindgen, in windows-bindgen's version of its format.
windows-metadata = "0.100"

# Lints for every package, which each takes with [lints] workspace = true.
[workspace.lints.clippy]
# Most unsafe functions here are unsafe because they call the Windows API,
# not for what their callers must do, and the code's comments are //
# comments, which clippy doesn't read as docs.
missing_safety_doc = "allow"
