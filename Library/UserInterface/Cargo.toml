[package]
name = "user-interface"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
# Every test is in Test/UserInterface.
test = false
doctest = false

[dependencies]
displays = { path = "../Displays" }
game-input = { path = "../GameInput" }
game-input-raw = { path = "../GameInputRaw" }
graphics = { path = "../Graphics" }
json = { path = "../Json" }
present-timing = { path = "../PresentTiming" }
windows-api-raw = { path = "../WindowsApiRaw" }

# Without its proc macros: the one COM object written here, the text
# renderer that collects DirectWrite's glyphs, is written by hand.
[dependencies.windows-core]
workspace = true

[build-dependencies]
shader-compiler = { path = "../ShaderCompiler" }

[lints]
workspace = true
