[package]
name = "bindings_generator"
version = "0.1.0"
edition = "2024"
# A workspace of its own, so it can't take the license from the root Cargo.toml.
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "BindingsGenerator"
path = "Source/Main.rs"

[dependencies]
windows-bindgen = "0.100"

# A standalone package, so the demo's normal builds never compile the generator.
[workspace]
