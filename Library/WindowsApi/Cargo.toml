[package]
name = "windows_api"
version = "0.1.0"
edition = "2024"

[lib]
path = "Source/Library.rs"
# Every test is in Test.
test = false
doctest = false

# Source/Bindings.rs is generated by BindingsGenerator, and needs only
# windows-core. Its proc macros (for implementing COM interfaces in Rust)
# aren't needed.
[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]
