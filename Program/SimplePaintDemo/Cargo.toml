[package]
name = "simple_paint_demo"
version = "0.1.0"
edition = "2024"
license.workspace = true
build = "Build.rs"

# The demo's parts, which Test/SimplePaintDemo tests without a window.
[lib]
path = "Source/Library.rs"
# Every test is in Test.
test = false
doctest = false

[[bin]]
name = "SimplePaintDemo"
path = "Source/Main.rs"
# Every test is in Test.
test = false

[dependencies]
graphics = { path = "../../Library/Graphics" }
json = { path = "../../Library/Json" }
math = { path = "../../Library/Math" }
meshes = { path = "../../Library/Meshes" }
paint_settings = { path = "../../Library/PaintSettings" }
simple_paint = { path = "../../Library/SimplePaint" }
user_interface = { path = "../../Library/UserInterface" }
windows_api = { path = "../../Library/WindowsApi" }

# Its proc macros (for implementing COM interfaces in Rust) aren't needed.
[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]

[build-dependencies]
shader_compiler = { path = "../../Library/ShaderCompiler" }

[lints]
workspace = true
