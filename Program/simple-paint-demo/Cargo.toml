[package]
name = "simple-paint-demo"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The demo's parts, which Test/simple-paint-demo tests without a window.
[lib]
# Every test is in Test.
test = false
doctest = false

[[bin]]
name = "simple-paint-demo"
# Every test is in Test.
test = false

[dependencies]
graphics = { path = "../../Library/graphics" }
json = { path = "../../Library/json" }
math = { path = "../../Library/math" }
meshes = { path = "../../Library/meshes" }
paint-settings = { path = "../../Library/paint-settings" }
simple-paint = { path = "../../Library/simple-paint" }
user-interface = { path = "../../Library/user-interface" }
windows-api-raw = { path = "../../Library/windows-api-raw" }

[dependencies.windows-core]
workspace = true

[build-dependencies]
shader-compiler = { path = "../../Library/shader-compiler" }

[lints]
workspace = true
