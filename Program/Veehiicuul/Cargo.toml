[package]
name = "veehiicuul"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The game's parts, which Test/Veehiicuul tests without a window.
[lib]
# Every test is in Test.
test = false
doctest = false

[[bin]]
name = "veehiicuul"
# Every test is in Test.
test = false

[dependencies]
gltf = { path = "../../Library/Gltf" }
graphics = { path = "../../Library/Graphics" }
json = { path = "../../Library/Json" }
math = { path = "../../Library/Math" }
meshes = { path = "../../Library/Meshes" }
paint-settings = { path = "../../Library/PaintSettings" }
simple-paint = { path = "../../Library/SimplePaint" }
user-interface = { path = "../../Library/UserInterface" }
windows-api-raw = { path = "../../Library/WindowsApiRaw" }

[dependencies.windows-core]
workspace = true

[build-dependencies]
shader-compiler = { path = "../../Library/ShaderCompiler" }

[lints]
workspace = true
