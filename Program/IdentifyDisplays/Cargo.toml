[package]
name = "identify_displays"
version = "0.1.0"
edition = "2024"

# The boxes, which Test/IdentifyDisplays tests without a window.
[lib]
path = "Source/Library.rs"
# Every test is in Test.
test = false
doctest = false

[[bin]]
name = "IdentifyDisplays"
path = "Source/Main.rs"
# Every test is in Test.
test = false

[dependencies]
displays = { path = "../../Library/Displays" }
user_interface = { path = "../../Library/UserInterface" }
windows_api = { path = "../../Library/WindowsApi" }

[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]

[lints]
workspace = true
