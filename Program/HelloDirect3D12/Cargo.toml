[package]
name = "hello_direct3d12"
version = "0.1.0"
edition = "2024"
build = "Build.rs"

[[bin]]
name = "HelloDirect3D12"
path = "Source/Main.rs"

# Source/Bindings.rs is generated by BindingsGenerator and needs only windows-core.
# Its proc macros (for implementing COM interfaces in Rust) aren't needed.
[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]
