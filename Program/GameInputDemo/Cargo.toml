[package]
name = "game_input_demo"
version = "0.1.0"
edition = "2024"

# The demo's parts, which Test/GameInputDemo tests without a window, and
# without GameInput.
[lib]
path = "Source/Library.rs"
# Every test is in Test.
test = false
doctest = false

[[bin]]
name = "GameInputDemo"
path = "Source/Main.rs"
# Every test is in Test.
test = false

[dependencies]
game_input = { path = "../../Library/GameInput" }
json = { path = "../../Library/Json" }
user_interface = { package = "user_interface_old", path = "../../Library/UserInterfaceOld" }
windows_api = { path = "../../Library/WindowsApi" }

# Its proc macros (for implementing COM interfaces in Rust) aren't needed.
[dependencies.windows-core]
version = "0.100"
default-features = false
features = ["std"]

[lints]
workspace = true
